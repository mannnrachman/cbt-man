name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          fail-on-scopes: unknown, runtime, development
      - name: Check pull-request contract
        if: github.event_name == 'pull_request'
        run: node scripts/check-pr-body.mjs
      - name: Check CBT-MAN PR hygiene
        env:
          CI_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node scripts/check-pr-hygiene.mjs
      - run: npm run lint -- --max-warnings=7
      - run: npm run typecheck
      - run: npm run test:unit
      - name: Verify Prisma migrations match schema
        run: node scripts/verify-prisma-schema.mjs
      - run: npm run build
      - name: Verify generated route tree
        run: git diff --exit-code -- src/routeTree.gen.ts
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright landing smoke
        env:
          DATABASE_URL: file:${{ github.workspace }}/prisma/e2e.db
          ADMIN_PASSWORD: e2e-smoke
        run: npm run test:e2e
